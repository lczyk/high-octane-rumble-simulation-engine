[build-system]
requires = ["uv_build>=0.5,<0.12"]
build-backend = "uv_build"

[project]
name = "high-octane-rumble-simulation-engine"
version = "0.1.0"
description = "It's a fight to the death!"
authors = [{ name = "Blaine Rogers", email = "blaine.w.rogers@gmail.com" }]
readme = "README.rst"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
blenc = "horse.compiler:main"
blen-rumble = "horse.tournament:main"

[tool.uv.build-backend]
module-name = "horse"
module-root = "src"

[dependency-groups]
dev = [
    "hypothesis>=6",
    "pytest>=7",
    "pytest-cov>=4",
    "ruff>=0.5",
    "mypy>=1.8",
    "tox>=4",
    "tox-uv>=1.11",
    #
]
