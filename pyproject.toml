[build-system]
requires = ["uv_build>=0.5,<0.12"]
build-backend = "uv_build"

[project]
name = "high-octane-rumble-simulation-engine"
version = "0.1.0"
description = "It's a fight to the death!"
authors = [{ name = "Blaine Rogers", email = "blaine.w.rogers@gmail.com" }]
readme = "README.rst"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
blenc = "horse.compiler:main"
blen-rumble = "horse.tournament:main"

[tool.uv.build-backend]
module-name = "horse"
module-root = "src"

[dependency-groups]
dev = [
    "hypothesis>=6",
    "pytest>=7",
    "pytest-cov>=4",
    "ruff>=0.5",
    "mypy>=1.8",
    "tox>=4",
    "tox-uv>=1.11",
    #
]

[tool.ruff]
exclude = [
    ".git",
    "__pycache__",
    ".venv",
    ".env",
    ".eggs",
    "*.egg",
    ".tox",
    ".mypy_cache",
    ".pytest_cache",
    ".ruff_cache",
    ".vscode",
    "dist",
    "build",
]
line-length = 120
lint.ignore = []
lint.select = [
    "E",   # pycodestyle
    "F",   # pyflakes
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
    "W",   # warnings
    "UP",  # pyupgrade
    "I",   # isort
    "Q",   # flake8-quotes
    "RUF", # ruff
    #
]
output-format = "concise"

[tool.mypy]
ignore_missing_imports = true
follow_imports = "normal"
namespace_packages = true
disallow_untyped_defs = true
no_implicit_optional = true
check_untyped_defs = true
warn_return_any = true
show_error_codes = true
warn_unused_ignores = true
warn_unused_configs = true
explicit_package_bases = true
extra_checks = true
local_partial_types = true
files = [
    "./src/**/*.py",
    "./tests/**/*.py",
    #
]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
check_untyped_defs = true

[tool.pytest.ini_options]
minversion = "7.0"
addopts = ["-s", "--tb=short", "--color=yes"]

[tool.coverage.run]
omit = [
    "tests/*",
    "**/__init__.py",
    #
]

[tool.coverage.report]
skip_empty = true
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "@abstractmethod",
    "if TYPE_CHECKING:",
    "except ImportError:",
    #
]
